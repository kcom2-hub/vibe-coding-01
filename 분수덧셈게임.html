<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>분수 덧셈 놀이터</title>
<style>
  :root{
    --bg:#FFF8E7; --card:#FFFFFF; --ink:#33334D;
    --orange:#FF8A3D; --yellow:#FFD23F; --green:#3BCEAC; --blue:#4D96FF;
    --pink:#FF6B9A; --purple:#9B72F2; --gray:#E9E6F2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:820px; padding:16px; display:flex; flex-direction:column; gap:14px;}
  .screen{display:none; flex-direction:column; gap:14px;}
  .screen.on{display:flex;}

  /* 시작/끝 화면 */
  .hero{background:var(--card); border-radius:28px; padding:36px 24px; text-align:center; box-shadow:0 8px 0 #F0E2C0;}
  .hero h1{font-size:44px; margin:8px 0 12px; color:var(--orange);}
  .hero p{font-size:22px; line-height:1.6; margin:8px 0;}
  .big-emoji{font-size:72px;}
  .rule{display:inline-block; text-align:left; background:#FFF3D6; border-radius:18px; padding:16px 22px; font-size:21px; line-height:1.8; margin:14px 0;}

  /* 상단 정보 */
  .top{display:flex; gap:12px;}
  .pill{flex:1; background:var(--card); border-radius:20px; padding:12px 16px; font-size:24px; font-weight:800; text-align:center; box-shadow:0 5px 0 #F0E2C0;}
  .pill .num{color:var(--blue);}
  .pill.score .num{color:var(--pink);}
  .bar{height:18px; background:var(--gray); border-radius:10px; overflow:hidden;}
  .bar > div{height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--blue)); transition:width .4s;}

  /* 문제 카드 */
  .card{background:var(--card); border-radius:28px; padding:22px 16px; box-shadow:0 8px 0 #F0E2C0;}
  .level{text-align:center; font-size:20px; font-weight:700; color:var(--purple); margin-bottom:8px;}
  .expr{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; font-size:44px; font-weight:800;}
  .mixed{display:inline-flex; align-items:center; gap:6px;}
  .frac{display:inline-flex; flex-direction:column; align-items:center; line-height:1.05;}
  .frac .line{width:100%; min-width:46px; height:5px; background:var(--ink); border-radius:3px; margin:4px 0;}
  .op{color:var(--orange); padding:0 4px;}

  /* 답 입력칸 */
  .ans{display:inline-flex; align-items:center; gap:8px;}
  .box{
    min-width:76px; height:66px; border:4px dashed #C9C3DD; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:40px; font-weight:800; color:var(--blue); cursor:pointer; background:#FAFAFF;
  }
  .box.whole{height:76px;}
  .box.sel{border:4px solid var(--blue); background:#EAF2FF;}
  .box .ph{font-size:16px; color:#A9A3C0; font-weight:700;}
  .ans .frac .line{min-width:80px;}

  .feedback{min-height:64px; margin-top:16px; border-radius:18px; padding:14px 18px; font-size:22px; line-height:1.6; text-align:center; font-weight:700; display:none;}
  .feedback.ok{display:block; background:#DDF8EF; color:#178A6E;}
  .feedback.hint{display:block; background:#FFF3D6; color:#9A5B00;}
  .feedback.info{display:block; background:#EAF2FF; color:#2F5FB3;}
  .hint-frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1; font-size:22px; margin:0 3px;}
  .hint-frac i{display:block; width:100%; min-width:22px; height:3px; background:currentColor; margin:2px 0;}

  /* 키패드 */
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .key{
    height:78px; border:none; border-radius:20px; font-size:36px; font-weight:800;
    background:var(--card); color:var(--ink); box-shadow:0 6px 0 #DCD6EA; cursor:pointer;
    font-family:inherit;
  }
  .key:active{transform:translateY(4px); box-shadow:0 2px 0 #DCD6EA;}
  .key.del{background:#FFE3EC; color:var(--pink); font-size:26px;}
  .key.move{background:#EDE6FF; color:var(--purple); font-size:26px;}

  .btn{
    width:100%; height:84px; border:none; border-radius:24px; font-size:32px; font-weight:900;
    color:#fff; cursor:pointer; font-family:inherit; letter-spacing:2px;
  }
  .btn:active{transform:translateY(4px);}
  .btn.go{background:var(--orange); box-shadow:0 7px 0 #D86A22;}
  .btn.check{background:var(--green); box-shadow:0 7px 0 #24A386;}
  .btn.next{background:var(--blue); box-shadow:0 7px 0 #2F74D6;}
  .hidden{display:none !important;}

  .stars{font-size:64px; letter-spacing:6px; margin:10px 0;}
  .result-score{font-size:60px; font-weight:900; color:var(--pink);}

  .pop{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

  @media (max-width:520px){
    .expr{font-size:34px;}
    .box{min-width:62px; height:56px; font-size:32px;}
    .key{height:66px; font-size:30px;}
    .hero h1{font-size:34px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 시작 화면 -->
  <section id="start" class="screen on">
    <div class="hero">
      <div class="big-emoji">🍰➕🍕</div>
      <h1>분수 덧셈 놀이터</h1>
      <div class="rule">
        📝 문제는 모두 <b>10개</b>예요<br>
        ⭐ 맞히면 <b>+10점</b>!<br>
        💡 틀리면 <b>힌트</b>를 줘요<br>
        ✂️ 답은 <b>기약분수</b>(더 약분할 수 없는 분수)로 써요
      </div>
      <p>준비됐나요?</p>
    </div>
    <button class="btn go" onclick="startGame()">시작하기 ▶</button>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="screen">
    <div class="top">
      <div class="pill">문제 <span class="num" id="qNo">1</span> / 10</div>
      <div class="pill score">점수 <span class="num" id="score">0</span>점</div>
    </div>
    <div class="bar"><div id="progress"></div></div>

    <div class="card" id="card">
      <div class="level" id="level"></div>
      <div class="expr" id="expr"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="pad" id="pad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key del" data-k="del">⌫ 지우기</button>
      <button class="key" data-k="0">0</button>
      <button class="key move" data-k="move">다음 칸 ➜</button>
    </div>
    <button class="btn check" id="checkBtn" onclick="checkAnswer()">확인하기 ✔</button>
    <button class="btn next hidden" id="nextBtn" onclick="nextQuestion()">다음 문제 ➜</button>
  </section>

  <!-- 결과 화면 -->
  <section id="end" class="screen">
    <div class="hero">
      <div class="big-emoji" id="endEmoji">🏆</div>
      <h1>모두 끝났어요!</h1>
      <div class="result-score"><span id="finalScore">0</span>점</div>
      <div class="stars" id="stars"></div>
      <p id="endMsg"></p>
      <p style="font-size:19px;color:#7A7495">한 번에 맞힌 문제: <b id="firstTry">0</b>개</p>
    </div>
    <button class="btn go" onclick="startGame()">다시 하기 🔄</button>
  </section>
</div>

<script>
const TOTAL = 10;
const gcd = (a,b) => b ? gcd(b, a % b) : a;
const lcm = (a,b) => a / gcd(a,b) * b;
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1)) + a;

let problems = [], idx = 0, score = 0, tries = 0, firstTry = 0, done = false;
let input = {w:'', n:'', d:''}, sel = 'n';

/* ---------- 문제 만들기 ---------- */
function properFrac(){
  const dens = [2,3,4,5,6,8,9,10,12];
  while(true){
    const d = dens[rnd(0, dens.length-1)], n = rnd(1, d-1);
    if (gcd(n,d) === 1) return {n, d};
  }
}
function makeProblem(i){
  // 1~3번: 합이 1보다 작음 / 4~7번: 합이 1보다 큼 / 8~10번: 대분수 덧셈
  while(true){
    const A = properFrac(), B = properFrac();
    if (A.d === B.d) continue;
    const L = lcm(A.d, B.d);
    if (L > 36) continue;
    const an = A.n * L / A.d, bn = B.n * L / B.d, s = an + bn;
    if (i < 3 && s >= L) continue;
    if (i >= 3 && i < 7 && s <= L) continue;
    const w1 = i >= 7 ? rnd(1,3) : 0, w2 = i >= 7 ? rnd(1,2) : 0;
    const V = (w1 + w2) * L + s;           // 전체 값 = V / L
    const g = gcd(V, L), rn = V / g, rd = L / g;
    return {w1, A, w2, B, L, an, bn, s, V,
            ansW: Math.floor(rn / rd), ansN: rn % rd, ansD: rd,
            level: i < 3 ? '🌱 1단계 · 분모가 다른 진분수' : i < 7 ? '🌿 2단계 · 합이 1보다 커요' : '🌳 3단계 · 대분수의 덧셈'};
  }
}

/* ---------- 화면 그리기 ---------- */
function fracHTML(n, d){ return `<span class="frac"><span>${n}</span><span class="line"></span><span>${d}</span></span>`; }
function numHTML(w, f){ return `<span class="mixed">${w ? `<span>${w}</span>` : ''}${fracHTML(f.n, f.d)}</span>`; }
function hf(n, d){ return `<span class="hint-frac"><span>${n}</span><i></i><span>${d}</span></span>`; }
function hm(w, n, d){ return (w ? w + ' ' : '') + hf(n, d); }

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

function render(){
  const p = problems[idx];
  document.getElementById('qNo').textContent = idx + 1;
  document.getElementById('score').textContent = score;
  document.getElementById('progress').style.width = (idx / TOTAL * 100) + '%';
  document.getElementById('level').textContent = p.level;
  document.getElementById('expr').innerHTML =
    numHTML(p.w1, p.A) + '<span class="op">+</span>' + numHTML(p.w2, p.B) + '<span class="op">=</span>' +
    `<span class="ans">
       <div class="box whole" data-f="w"></div>
       <span class="frac"><div class="box" data-f="n"></div><span class="line"></span><div class="box" data-f="d"></div></span>
     </span>`;
  document.querySelectorAll('.box').forEach(b => b.addEventListener('click', () => { if(!done){ sel = b.dataset.f; drawBoxes(); } }));
  drawBoxes();
}

function drawBoxes(){
  const label = {w:'자연수', n:'분자', d:'분모'};
  document.querySelectorAll('.box').forEach(b => {
    const f = b.dataset.f;
    b.innerHTML = input[f] !== '' ? input[f] : `<span class="ph">${label[f]}</span>`;
    b.classList.toggle('sel', f === sel && !done);
  });
}

function setFeedback(type, html){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + type;
  fb.innerHTML = html;
  fb.classList.remove('pop'); void fb.offsetWidth; fb.classList.add('pop');
}
function clearFeedback(){ const fb = document.getElementById('feedback'); fb.className = 'feedback'; fb.innerHTML = ''; }

/* ---------- 키패드 ---------- */
document.getElementById('pad').addEventListener('click', e => {
  const k = e.target.closest('.key'); if (!k || done) return;
  const v = k.dataset.k;
  if (v === 'del') input[sel] = input[sel].slice(0, -1);
  else if (v === 'move') sel = sel === 'w' ? 'n' : sel === 'n' ? 'd' : 'w';
  else if (input[sel].length < 2) input[sel] = (input[sel] === '0' ? '' : input[sel]) + v;
  drawBoxes();
});

/* ---------- 채점 ---------- */
function checkAnswer(){
  if (done) return;
  const p = problems[idx];
  const w = parseInt(input.w || '0', 10), n = parseInt(input.n || '0', 10), d = parseInt(input.d || '0', 10);

  if (input.n === '' || input.d === '' || d === 0){
    setFeedback('info', '분자와 분모를 모두 입력해 주세요 ✏️'); return;
  }
  const sameValue = (w * d + n) * p.L === p.V * d;
  const reduced = gcd(n, d) === 1 && (w === 0 || n < d);

  if (sameValue && !reduced){
    setFeedback('info', `값은 맞았어요! 👍<br>그런데 더 간단하게 만들 수 있어요.<br>${n >= d && w > 0 ? '분수 부분이 1보다 크면 자연수로 올려 주세요.' : `분자와 분모를 같은 수로 나누어 <b>약분</b>해 보세요.`}`);
    return;
  }

  tries++;
  if (sameValue){
    score += 10; if (tries === 1) firstTry++;
    document.getElementById('score').textContent = score;
    const praise = ['정답이에요! 🎉','최고예요! 🌟','완벽해요! 💯','멋져요! 👏','대단해요! 🚀'][rnd(0,4)];
    setFeedback('ok', `${praise} <b>+10점</b>`);
    finishQuestion();
    return;
  }

  const card = document.getElementById('card');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');

  if (tries === 1){
    setFeedback('hint', `💡 <b>힌트 1</b><br>${p.w1 ? '자연수는 자연수끼리, 분수는 분수끼리 더해요.<br>' : ''}분모 <b>${p.A.d}</b>와 <b>${p.B.d}</b>를 같게 만들어요(통분).<br>${p.A.d}와 ${p.B.d}의 최소공배수는 <b>${p.L}</b>이에요. 다시 해 볼까요?`);
  } else if (tries === 2){
    const wSum = p.w1 + p.w2;
    let steps = `${hf(p.A.n, p.A.d)} = ${hf(p.an, p.L)}, &nbsp; ${hf(p.B.n, p.B.d)} = ${hf(p.bn, p.L)}<br>` +
                `${hf(p.an, p.L)} + ${hf(p.bn, p.L)} = ${hf(p.s, p.L)}`;
    if (wSum) steps += `<br>자연수끼리: ${p.w1} + ${p.w2} = ${wSum}`;
    setFeedback('hint', `💡 <b>힌트 2</b><br>${steps}<br>이제 ${p.s >= p.L ? '1보다 큰 부분은 자연수로 올리고, ' : ''}약분할 수 있는지 확인해 보세요!`);
  } else {
    setFeedback('info', `괜찮아요, 다음엔 꼭 맞힐 수 있어요! 💪<br>정답은 ${hm(p.ansW, p.ansN, p.ansD)} 이에요.`);
    input = {w: p.ansW ? String(p.ansW) : '', n: String(p.ansN), d: String(p.ansD)};
    finishQuestion();
  }
}

function finishQuestion(){
  done = true; drawBoxes();
  document.getElementById('checkBtn').classList.add('hidden');
  const nb = document.getElementById('nextBtn');
  nb.textContent = idx === TOTAL - 1 ? '결과 보기 🏆' : '다음 문제 ➜';
  nb.classList.remove('hidden');
}

function nextQuestion(){
  idx++;
  if (idx >= TOTAL){ showEnd(); return; }
  resetQuestion(); render();
}

function resetQuestion(){
  tries = 0; done = false; input = {w:'', n:'', d:''}; sel = 'n';
  clearFeedback();
  document.getElementById('checkBtn').classList.remove('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
}

/* ---------- 시작 / 끝 ---------- */
function startGame(){
  problems = Array.from({length: TOTAL}, (_, i) => makeProblem(i));
  idx = 0; score = 0; firstTry = 0;
  resetQuestion(); show('game'); render();
}

function showEnd(){
  document.getElementById('progress').style.width = '100%';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('firstTry').textContent = firstTry;
  const star = score >= 90 ? 3 : score >= 60 ? 2 : 1;
  document.getElementById('stars').textContent = '⭐'.repeat(star) + '☆'.repeat(3 - star);
  document.getElementById('endEmoji').textContent = star === 3 ? '🏆' : star === 2 ? '🥈' : '🌱';
  document.getElementById('endMsg').textContent =
    star === 3 ? '분수 덧셈 박사님이네요!' : star === 2 ? '아주 잘했어요! 조금만 더 연습해요.' : '통분부터 차근차근 다시 도전해 봐요!';
  show('end');
}
</script>
</body>
</html>
